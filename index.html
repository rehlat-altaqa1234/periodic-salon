<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صالون الجدول الدوري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff4f8; --ink:#3b2340; --muted:#8a6a8f; --card:#ffffff; --soft:#fbe3ee;
  --pink:#ff6f91; --plum:#8a4fa0; --teal:#2bb3a3; --gold:#f2b632; --red:#ef5b5b;
  --c-alkali:#ff9a76; --c-alkaline:#ffc85c; --c-trans:#e3a4dc; --c-metal:#a9c8ea;
  --c-metalloid:#8fe0c6; --c-nonmetal:#b5e37a; --c-halogen:#fff07a; --c-noble:#8ccaf7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Almarai',sans-serif;background:var(--bg);background-image:radial-gradient(#ffd9e6 1.5px,transparent 1.5px);background-size:22px 22px;color:var(--ink);min-height:100vh;padding:14px 10px 30px}
.wrap{max-width:1000px;margin:0 auto}
h1{font-weight:800;font-size:clamp(22px,5vw,32px);text-align:center}
h1 span{color:var(--pink)}
.sub{text-align:center;color:var(--muted);font-size:14px;margin:4px 0 14px}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 6px 20px rgba(138,79,160,.12)}
.hidden{display:none!important}
/* start */
.opt-title{font-weight:700;margin:14px 0 8px;font-size:15px;color:var(--plum)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--soft);border:2px solid transparent;border-radius:14px;padding:12px;cursor:pointer;color:var(--ink);font-family:inherit;text-align:right}
.opt b{display:block;font-size:16px;margin-bottom:4px}
.opt small{color:var(--muted);font-size:12.5px;line-height:1.5}
.opt.sel{border-color:var(--pink);background:#ffd3e1}
.btn{display:block;width:100%;margin-top:16px;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--pink),var(--plum));color:#fff;font-family:inherit;font-weight:800;font-size:18px;cursor:pointer}
.btn:active{transform:scale(.97)}
.name-in{width:100%;padding:13px 14px;border:2px solid var(--soft);border-radius:14px;font-family:inherit;font-size:16px;background:var(--soft);color:var(--ink);outline:none}
.name-in:focus{border-color:var(--pink);background:#fff}
.look{display:flex;flex-direction:column;gap:8px;margin-top:10px;background:var(--soft);border-radius:14px;padding:10px}
.ba{display:flex;gap:12px;justify-content:center}.ba figure{text-align:center;font-size:13px;font-weight:700}
.look-prev{width:120px;height:150px;padding-top:14px;overflow:hidden;background:repeating-linear-gradient(90deg,#ffe3ee 0 12px,#ffd3e3 12px 24px);border-radius:12px}
.look-opts{flex:1}
.lk{font-size:12px;color:var(--muted);margin:4px 0 4px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid transparent;background:#fff;border-radius:10px;padding:5px 9px;font-family:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.chip.sel{border-color:var(--pink);background:#ffd3e1}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid #fff;cursor:pointer;box-shadow:0 0 0 1px #0002}
.sw.sel{box-shadow:0 0 0 3px var(--pink)}
.hero{height:230px;border-radius:16px;padding-top:26px;overflow:hidden;background:repeating-linear-gradient(90deg,#ffe3ee 0 22px,#ffd3e3 22px 44px)}
.hero svg{display:block;margin:0 auto;width:auto!important;height:100%!important}
.school{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#ffd3e1,#ffe9f1);border-radius:16px;padding:8px 12px;margin:0 0 12px;border:3px solid var(--pink);box-shadow:0 4px 14px rgba(255,111,145,.2)}
.school img{height:56px;width:auto}
.sch-t{flex:1;font-size:14px;line-height:1.6;color:#2f5f66}
.sch-t b{color:var(--ink)}
.sch-t .by{color:var(--plum);margin-top:2px}
.credit{text-align:center;font-size:12px;color:var(--muted);margin-top:14px}
.cert{margin:12px 0;padding:6px;border-radius:18px;background:linear-gradient(135deg,#f2c94c,#2bb3a3,#f2c94c)}
.cert-in{background:#fffdf7;border-radius:13px;padding:14px 14px 12px;border:2px dashed #e6c873;text-align:center}
.c-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.c-top img{height:46px}
.c-sch{font-size:11px;line-height:1.6;color:#2f5f66;text-align:right}
.c-title{font-size:26px;font-weight:800;color:#1f7d70;margin:10px 0 6px;letter-spacing:1px}
.c-title:before,.c-title:after{content:'✦';color:#f2b632;margin:0 8px;font-size:18px}
.c-body{display:flex;align-items:center;gap:10px}
.c-pic{flex:0 0 92px;height:120px}
.c-body p{flex:1;font-size:15px;line-height:2;text-align:center}
.cn{font-size:20px;font-weight:800;color:var(--pink)}
.c-stars{font-size:22px;margin:6px 0}.c-stars span{display:block;font-size:12px;color:var(--muted)}
.c-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);border-top:1px solid #eee2c4;padding-top:8px;margin-top:6px}
.c-foot b{color:var(--ink);font-size:13px}
.sig{font-family:'Almarai';font-style:italic}
.btn.ghost{background:var(--soft);color:var(--ink);font-size:15px}
.intro{display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.7}
.intro svg{flex:0 0 74px;height:80px}
/* layout */
.play{display:grid;gap:12px}
@media(min-width:860px){.play{grid-template-columns:470px 1fr;align-items:start}}
/* scene */
.scene{position:relative;height:272px;border-radius:20px;overflow:hidden;
  background:repeating-linear-gradient(90deg,#ffe3ee 0 22px,#ffd3e3 22px 44px);box-shadow:0 6px 20px rgba(138,79,160,.15)}
.floor{position:absolute;bottom:0;left:0;right:0;height:46px;background:repeating-linear-gradient(45deg,#f6e8f0 0 14px,#ead2e0 14px 28px)}
.mirror{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:170px;height:200px;border-radius:85px 85px 16px 16px;background:linear-gradient(160deg,#e9f7fb,#c8e9f1 60%,#e9f7fb);border:7px solid var(--gold);box-shadow:inset 0 0 0 3px #fff6}
.shelf{position:absolute;top:58px;right:10px;font-size:22px;display:flex;flex-direction:column;gap:6px;background:#fff8;padding:6px 4px;border-radius:10px}
.shelf.l{right:auto;left:10px}
.char{position:absolute;left:50%;bottom:6px;width:196px;height:257px;transform:translateX(-50%);transition:transform .7s cubic-bezier(.5,-.3,.5,1.3)}
.char.out{transform:translateX(calc(-50% - 420px))}
.char.in-start{transform:translateX(calc(-50% + 420px));transition:none}
.char.pop svg{animation:pop .45s}
.char.shake svg{animation:shake .5s}
@keyframes pop{40%{transform:scale(1.08)}}
@keyframes shake{20%,60%{transform:rotate(-4deg)}40%,80%{transform:rotate(4deg)}}
.bubble{position:absolute;top:10px;right:12px;max-width:150px;background:#fff;border-radius:16px;padding:8px 10px;font-size:13.5px;font-weight:700;line-height:1.5;box-shadow:0 3px 10px rgba(0,0,0,.12);z-index:4;transition:opacity .2s}
.bubble:after{content:'';position:absolute;bottom:-8px;right:30px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.namechip{position:absolute;bottom:8px;right:10px;background:#fffc;border-radius:10px;padding:3px 10px;font-size:13px;font-weight:700;z-index:4}
.tool{position:absolute;left:50%;top:40px;font-size:40px;z-index:5;pointer-events:none;opacity:0}
.tool.go{animation:sweep 1.1s ease-in-out}
@keyframes sweep{0%{opacity:0;transform:translate(40px,0) rotate(0)}15%{opacity:1}35%{transform:translate(-90px,20px) rotate(-20deg)}55%{transform:translate(20px,40px) rotate(10deg)}75%{transform:translate(-60px,55px) rotate(-15deg)}90%{opacity:1}100%{opacity:0;transform:translate(0,30px)}}
.bub{animation:bub 1.8s ease-out forwards}
@keyframes bub{0%{opacity:0;transform:translateY(10px)}20%{opacity:.95}100%{opacity:0;transform:translateY(-30px)}}
.spark{animation:tw 1.2s infinite alternate}
@keyframes tw{from{opacity:.2}to{opacity:1}}
/* services */
.stage{display:grid;grid-template-columns:1fr 138px;gap:8px;align-items:stretch}
.stage .scene{height:auto;min-height:300px}
.stage .mirror{top:auto;bottom:70px}
.stage .shelf{top:auto;bottom:110px}
.stage .bubble{top:16px;bottom:auto;right:12px;left:12px;max-width:none;text-align:center}
.services{display:flex;flex-direction:column;gap:4px;background:#fff;border-radius:16px;padding:6px;box-shadow:0 6px 20px rgba(138,79,160,.12)}
.svh{font-size:12.5px;font-weight:800;text-align:center;color:var(--plum);padding:2px 0 4px}
.sv{display:flex;align-items:center;gap:5px;background:var(--soft);border-radius:10px;padding:5px 6px;font-size:12px;border:2px solid transparent;color:var(--ink)}
.sv .i{font-size:15px;width:20px;text-align:center}
.sv .t{flex:1;line-height:1.3}
.sv .st{font-size:12px}
.sv.now{border-color:var(--gold);background:#fff4d6;font-weight:700;animation:glow 1s infinite alternate}
.sv.done{background:#d9f5ef;color:#1f7d70}
@keyframes glow{to{box-shadow:0 0 0 4px #f2b63244}}
/* hud */
.hud{display:flex;gap:6px;margin-bottom:8px}
.pill{flex:1;background:var(--card);border-radius:12px;padding:6px 4px;text-align:center;box-shadow:0 2px 8px rgba(138,79,160,.08)}
.pill .k{font-size:11px;color:var(--muted)}
.pill .v{font-weight:800;font-size:18px}
.q{background:linear-gradient(135deg,#8a4fa0,#c45a9a);color:#fff;border-radius:16px;padding:12px;text-align:center;margin-bottom:8px}
.q .tag{font-size:12px;opacity:.85;margin-bottom:4px}
.q .text{font-size:clamp(17px,4.3vw,22px);font-weight:700;line-height:1.6}
.q .text em{font-style:normal;color:#ffe27a}
.fb{min-height:40px;text-align:center;font-size:14px;padding:7px;border-radius:12px;margin-bottom:8px;line-height:1.6;background:#fff8}
.fb.ok{background:#d9f5ef;color:#14695e}
.fb.no{background:#ffe0e0;color:#a33}
/* table */
.tbl-scroll{overflow-x:auto;padding-bottom:4px}
.tbl{direction:ltr;display:grid;gap:3px;margin:0 auto}
.gh,.ph{font-size:10px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.cell{aspect-ratio:1/1.08;border-radius:7px;background:#efe3ec;border:0;color:var(--ink);font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;transition:transform .12s;padding:0}
.cell:hover{transform:scale(1.08);z-index:2}
.cell .n{font-size:9px;opacity:.7;position:absolute;top:2px;left:4px}
.cell .s{font-weight:800;font-size:clamp(12px,2.5vw,17px)}
.cell.flash-ok{animation:ok .6s}
.cell.flash-no{animation:no .5s;background:var(--red)!important;color:#fff}
.cell.hint{animation:pulse .9s infinite;outline:3px solid var(--gold)}
@keyframes ok{40%{transform:scale(1.3)}}
@keyframes no{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes pulse{50%{transform:scale(1.15)}}
.legend{display:flex;flex-wrap:wrap;gap:5px 10px;justify-content:center;margin-top:10px;font-size:11.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:11px;height:11px;border-radius:3px}
.rotate{text-align:center;font-size:12px;color:var(--muted);margin-top:4px}
/* end */
.big{font-size:48px;text-align:center;letter-spacing:4px}
.score-big{text-align:center;font-size:34px;font-weight:800;color:var(--plum)}
.end-line{text-align:center;color:var(--muted);margin:6px 0 10px;line-height:1.7}
.gallery{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:8px 0}
.gallery figure{background:var(--soft);border-radius:16px;padding:6px 6px 4px;text-align:center;font-size:13px;font-weight:700;width:120px}
.gallery svg{width:100%;height:140px}
.review{margin-top:10px;background:var(--soft);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.9}
.review b{color:var(--plum)}
.mute{position:fixed;bottom:12px;left:12px;background:#fff;border:0;border-radius:50%;width:38px;height:38px;font-size:17px;cursor:pointer;z-index:9;box-shadow:0 2px 8px #0002}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:50}
</style>
</head>

      FLY.map(d=>`<path d="${d}" stroke="${col}" stroke-width="3" fill="none" stroke-linecap="round"/>`).join('')+
      CURLS.map(d=>`<path d="${d}" stroke="${light}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`).join('');
  }else if(!styled){back=`<path d="${SMOOTH}" fill="${col}"/>`;}
  else{
    back=`<path d="${BACK[c.style]}" fill="${col}"/>`;
    if(c.style==='pony')back=`<path d="M146 62 C190 48 200 100 180 140 C176 112 165 90 146 76Z" fill="${col}"/>`+back;
    if(c.style==='buns')back=`<circle cx="56" cy="56" r="22" fill="${col}"/><circle cx="144" cy="56" r="22" fill="${col}"/>`+back;

  if(st>=3)front+=`<path d="M74 66 Q100 54 126 66" stroke="#fff" stroke-opacity=".35" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  if(styled&&c.style==='pony')front+=`<circle cx="148" cy="66" r="6" fill="${c.bow}"/>`;
  const brows=st===0?'<path d="M77 103 L90 98 M110 98 L123 103" stroke="#3b2340" stroke-width="2.5" stroke-linecap="round"/>'

  const eyes=st===0?'<path d="M79 113 L89 113 M111 113 L121 113" stroke="#3b2340" stroke-width="3" stroke-linecap="round"/>'

     (st>=7?'<path d="M77 110 l-3 -3 M80 108 l-2 -4 M123 110 l3 -3 M120 108 l2 -4" stroke="#3b2340" stroke-width="1.6" stroke-linecap="round"/>':'');
  const cheeks=st>=6?'<ellipse cx="73" cy="126" rx="8" ry="5" fill="#ff7f9e" opacity=".6"/><ellipse cx="127" cy="126" rx="8" ry="5" fill="#ff7f9e" opacity=".6"/>':'';
  const lip=st>=8?'#e0446a':'#8a3040';
  const mouth=st===0?'<path d="M88 137 Q100 128 112 137" stroke="#8a3040" stroke-width="3" fill="none" stroke-linecap="round"/>'
    :st<4?'<path d="M91 134 Q100 136 109 134" stroke="#8a3040" stroke-width="3" fill="none" stroke-linecap="round"/>'
    :st<8?'<path d="M87 131 Q100 142 113 131" stroke="#8a3040" stroke-width="3" fill="none" stroke-linecap="round"/>'
    :st<LAST?`<path d="M87 131 Q100 136 113 131 Q100 145 87 131Z" fill="${lip}"/>`
    :`<path d="M85 130 Q100 150 115 130Z" fill="${lip}"/><path d="M90 131 L110 131 L108 134 L92 134Z" fill="#fff"/>`;
  const sweat=st===0?'<path d="M140 92 q5 8 0 12 q-5 -4 0 -12Z" fill="#8ccaf7"/><path d="M60 96 q4 7 0 10 q-4 -3 0 -10Z" fill="#8ccaf7"/>':'';
  if(st===2)front+='<path d="M66 78 q2 6 0 8 q-3 -2 0 -8Z M134 80 q2 6 0 8 q-3 -2 0 -8Z M100 64 q2 6 0 8 q-3 -2 0 -8Z" fill="#8ccaf7"/>';
  if(st===2)over=[[60,60,7],[82,42,9],[108,40,8],[132,52,10],[150,80,7],[46,86,8],[100,30,6],[120,70,6],[70,80,5]]
     .map(([x,y,r],i)=>`<circle class="bub" style="animation-delay:${i*.08}s" cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="#bfe6f5" stroke-width="2"/>`).join('');
  if(st>=9)over+=accSVG(c);
  let jewel='';
  if(st>=LAST){
    jewel='<g fill="#f2c94c" stroke="#c99a1e" stroke-width="1"><circle cx="57" cy="126" r="3"/><path d="M57 129 l-3 7 h6Z"/><circle cx="143" cy="126" r="3"/><path d="M143 129 l-3 7 h6Z"/></g>'+
      [...Array(9)].map((_,i)=>{const a=Math.PI*(.18+i*.08);return `<circle cx="${(100-30*Math.cos(a)).toFixed(1)}" cy="${(166+16*Math.sin(a)).toFixed(1)}" r="3.2" fill="#f2c94c" stroke="#c99a1e"/>`}).join('');
    over+=[[34,40],[168,36],[24,150],[176,150],[100,14]].map(([x,y],i)=>`<path class="spark" style="animation-delay:${i*.2}s" transform="translate(${x} ${y})" d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2Z" fill="#f2b632"/>`).join('');
  }
  return `<svg viewBox="0 0 200 262" width="100%" height="100%" style="overflow:visible" xmlns="http://www.w3.org/2000/svg">
   ${back}
   <rect x="89" y="140" width="22" height="32" fill="${c.skin}"/>
   <path d="M54 222 L146 222 L162 262 L38 262Z" fill="#1f2a5a"/><path d="M54 222 L146 222 L147 229 L53 229Z" fill="#17204a"/>
   <path d="M76 229 L70 262 M100 229 L100 262 M124 229 L130 262" stroke="#2f3d78" stroke-width="2"/>
   <path d="M31 196 Q24 222 32 244 L46 244 Q42 222 51 200Z" fill="${c.skin}"/><path d="M169 196 Q176 222 168 244 L154 244 Q158 222 149 200Z" fill="${c.skin}"/>
   <ellipse cx="39" cy="246" rx="9.5" ry="10" fill="${c.skin}" stroke="#00000026" stroke-width="1.2"/><ellipse cx="161" cy="246" rx="9.5" ry="10" fill="${c.skin}" stroke="#00000026" stroke-width="1.2"/>
   <path d="M33 249 l1 6 M38 251 l0 6 M43 250 l-1 6 M167 249 l-1 6 M162 251 l0 6 M157 250 l1 6" stroke="#0000001f" stroke-width="1.5" stroke-linecap="round"/>
   <path d="M52 225 L52 186 Q60 172 100 166 Q140 172 148 186 L148 225Z" fill="#fff" stroke="#ddd3dd" stroke-width="1.5"/>
   <path d="M60 174 Q38 178 30 198 L52 204 L56 186Z" fill="#fff" stroke="#ddd3dd" stroke-width="1.5"/><path d="M140 174 Q162 178 170 198 L148 204 L144 186Z" fill="#fff" stroke="#ddd3dd" stroke-width="1.5"/>
   <path d="M100 168 L86 167 L90 184Z M100 168 L114 167 L110 184Z" fill="#fff" stroke="#cfc4cf" stroke-width="1.5"/>
   <g fill="#cfc4cf"><circle cx="100" cy="190" r="2"/><circle cx="100" cy="203" r="2"/><circle cx="100" cy="216" r="2"/></g>
   ${extra}
   <circle cx="58" cy="116" r="7" fill="${c.skin}"/><circle cx="142" cy="116" r="7" fill="${c.skin}"/>
   <circle cx="100" cy="110" r="42" fill="${c.skin}"/>
   ${front}${brows}${shadow}${eyes}${cheeks}${mouth}${sweat}${jewel}${over}</svg>`;
}

/* ================= HELPERS ================= */
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const $=id=>document.getElementById(id);
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const settings={level:20,mode:'open'};
let S={},timer=null,muted=false,actx=null,pending=[];
const later=(f,ms)=>pending.push(setTimeout(f,ms));
const clearLater=()=>{pending.forEach(clearTimeout);pending=[]};

document.querySelectorAll('.opts').forEach(box=>box.addEventListener('click',e=>{
  const b=e.target.closest('.opt');if(!b)return;
  box.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));b.classList.add('sel');
  const v=b.dataset.v;settings[box.dataset.group]=isNaN(v)?v:+v;
}));
const STYLES=[['pony','ذيل حصان'],['bob','قصير'],['buns','كعكتين'],['long','طويل']];
const DYES=[['#c98a3d','العسلي'],['#8e2c48','العنّابي'],['#e88bb5','الوردي'],['#7a3b1e','الشوكولاتة'],['#b5562f','النحاسي'],['#5b3b8c','البنفسجي']];
const SKINS=['#f6d3b8','#f0bf98','#d9a07a','#b97c55'];
const BOWS=['#ff6f91','#f2b632','#4fa3e8','#b07cf0','#2bb3a3','#ff9a3c'];
const ACCS=[['bow','فيونكة','الفيونكة'],['crown','تاج','التاج'],['flower','وردة','الوردة']];
const look={style:'pony',dye:0,skin:1,acc:'bow'};
function myLook(name){return{name,skin:SKINS[look.skin],natural:'#4b3324',dye:DYES[look.dye][0],dyeName:DYES[look.dye][1],style:look.style,bow:BOWS[look.dye],acc:look.acc,accName:ACCS.find(a=>a[0]===look.acc)[2]}}
function randomLook(){look.style=STYLES[Math.floor(Math.random()*4)][0];look.dye=Math.floor(Math.random()*DYES.length);look.acc=ACCS[Math.floor(Math.random()*3)][0];}
$('hero').innerHTML=charSVG(myLook(''),0);

function beep(type){
  if(muted)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const seq={ok:[[660,0],[880,.09]],no:[[220,0],[160,.12]],win:[[523,0],[659,.12],[784,.24],[1046,.36]],bell:[[1318,0],[1046,.15]],sw:[[400,0],[500,.05],[600,.1],[700,.15]]}[type];
    seq.forEach(([f,t])=>{const o=actx.createOscillator(),g=actx.createGain();
      o.type=type==='no'?'sawtooth':'triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.16,actx.currentTime+t+.02);
      g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t+.2);
      o.connect(g).connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.22);});
  }catch(e){}
}
$('muteBtn').onclick=()=>{muted=!muted;$('muteBtn').textContent=muted?'🔇':'🔊'};

/* ================= TABLE ================= */
function buildTable(){
  const cols=settings.level===20?[1,2,13,14,15,16,17,18]:[...Array(18)].map((_,i)=>i+1);
  const els=EL.filter(e=>e.z<=settings.level),t=$('tbl');t.innerHTML='';
  t.style.gridTemplateColumns=`20px repeat(${cols.length},${settings.level===20?'minmax(34px,62px)':'minmax(30px,40px)'})`;
  t.style.maxWidth=settings.level===20?'540px':'760px';
  t.appendChild(Object.assign(document.createElement('div'),{className:'gh'}));
  cols.forEach(g=>t.appendChild(Object.assign(document.createElement('div'),{className:'gh',textContent:g})));
  for(let p=1;p<=4;p++){
    t.appendChild(Object.assign(document.createElement('div'),{className:'ph',textContent:p}));
    cols.forEach(g=>{
      const e=els.find(x=>x.p===p&&x.g===g);
      if(!e){t.appendChild(document.createElement('div'));return}
      const b=document.createElement('button');b.className='cell';b.dataset.z=e.z;
      b.setAttribute('aria-label',`الدورة ${p} المجموعة ${g}`);b.onclick=()=>answer(e,b);t.appendChild(b);
    });
  }
  $('rotHint').classList.toggle('hidden',settings.level===20);
  $('legend').innerHTML=[...new Set(els.map(e=>e.c))].map(c=>`<span><i style="background:${CATS[c].c}"></i>${CATS[c].ar}</span>`).join('');
  renderCells();
}
function renderCells(){
  document.querySelectorAll('.cell').forEach(b=>{
    const e=EL[b.dataset.z-1],found=S.found.has(e.z);
    b.innerHTML=(settings.mode==='open'||found)?`<span class="n">${e.z}</span><span class="s">${e.s}</span>`:'';
    b.style.background=found?CATS[e.c].c:'';
  });
}

/* ================= QUESTIONS ================= */
function newQ(){
  if(!S.queue.length)S.queue=shuffle(EL.filter(e=>e.z<=settings.level));
  const e=S.queue.pop();
  const types=settings.mode==='open'?['name','name','pos','cat']:['name','sym','num','pos','cat'];
  return {e,t:types[Math.floor(Math.random()*types.length)]};
}
function qHTML(q){const e=q.e;return{
  name:['🔎 أين يقع العنصر؟',`أين يقع عنصر <em>${e.n}</em>؟`],
  sym:['🔤 من الرمز',`أين يقع العنصر الذي رمزه <em dir="ltr">${e.s}</em>؟`],
  num:['🔢 من العدد الذري',`العنصر الذي عدده الذري <em>${AR(e.z)}</em>`],
  pos:['📍 من الموقع',`العنصر في <em>الدورة ${AR(e.p)}</em> و<em>المجموعة ${AR(e.g)}</em>`],
  cat:['👨‍👩‍👧 من العائلة',`اختاري أي عنصر من <em>${CATS[e.c].ar}</em>`]}[q.t]}
const isCorrect=(q,p)=>q.t==='cat'?p.c===q.e.c:p.z===q.e.z;
const info=e=>`<b>${e.n}</b> (<span dir="ltr">${e.s}</span>) — ${CATS[e.c].one}، الدورة ${AR(e.p)}، المجموعة ${AR(e.g)}`;

/* ================= SALON ================= */
function say(t){const b=$('bubble');b.style.opacity=0;setTimeout(()=>{b.innerHTML=t;b.style.opacity=1},150)}
function drawChar(anim){
  const ch=$('char');ch.innerHTML=charSVG(S.cust,S.step);
  if(anim){ch.classList.remove(anim);void ch.offsetWidth;ch.classList.add(anim)}
}
function renderServices(){
  $('hC').textContent=`${AR(S.step)}/${AR(LAST)}`;
  $('services').innerHTML='<div class="svh">🧾 قائمة الخدمات</div>'+SERV.map((sv,i)=>`<div class="sv ${i<S.step?'done':i===S.step?'now':''}"><span class="i">${sv.icS}</span><span class="t">خدمة ${sv.label}</span><span class="st">${i<S.step?'✅':i===S.step?'⏳':''}</span></div>`).join('');
}
function playTool(i){
  const t=$('tool');t.innerHTML=SERV[i].ic;t.style.top=(SERV[i].top||40)+'px';t.classList.remove('go');void t.offsetWidth;t.classList.add('go');beep('sw');
}
function enterCustomer(){
  S.cust=S.custs[S.ci];S.step=0;
  const ch=$('char');ch.classList.remove('out');ch.classList.add('in-start');drawChar();
  void ch.offsetWidth;ch.classList.remove('in-start');
  $('namechip').textContent='👧 '+S.cust.name;
  beep('bell');say(`أهلًا ${S.cust.name}! 😅 شعرك منفوش… جاوبي صح ونبدأ!`);
  renderServices();later(nextQ,900);
}

function start(){
  clearLater();clearInterval(timer);
  const real=$('custName').value.trim();const nm=real||'الزبونة';randomLook();
  S={real,custs:[myLook(nm)],ci:0,step:0,coins:0,streak:0,best:0,correct:0,attempts:0,found:new Set(),wrong:[],queue:[],lock:true};
  $('start').classList.add('hidden');$('end').classList.add('hidden');$('game').classList.remove('hidden');
  buildTable();upd();enterCustomer();
}
function nextQ(){
  S.q=newQ();const[tag,txt]=qHTML(S.q);
  $('qTag').textContent=`${tag} — للخدمة: ${SERV[S.step].label} ${SERV[S.step].icS}`;$('qText').innerHTML=txt;
  $('fb').className='fb';$('fb').textContent='';
  document.querySelectorAll('.cell.hint').forEach(c=>c.classList.remove('hint'));
  S.lock=false;S.t0=Date.now();S.left=20;$('hT').textContent=AR(20);$('hT').style.color='';
  clearInterval(timer);
  timer=setInterval(()=>{S.left--;$('hT').textContent=AR(Math.max(S.left,0));
    if(S.left<=5)$('hT').style.color='var(--red)';
    if(S.left<=0){clearInterval(timer);timeout()}},1000);
}
function answer(picked,btn){
  if(S.lock)return;S.lock=true;clearInterval(timer);S.attempts++;
  const q=S.q;
  if(isCorrect(q,picked)){
    const secs=(Date.now()-S.t0)/1000;
    S.streak++;S.best=Math.max(S.best,S.streak);S.correct++;
    const tip=5+Math.max(0,Math.round(10-secs))+(S.streak>=3?5:0);
    S.coins+=tip;S.found.add(picked.z);renderCells();
    btn.classList.add('flash-ok');later(()=>btn.classList.remove('flash-ok'),600);beep('ok');
    $('fb').className='fb ok';$('fb').innerHTML=`✅ أحسنتِ! إكرامية 💰${AR(tip)} ${S.streak>=3?'🔥':''}<br>${info(picked)}`;
    const i=S.step;playTool(i);
    later(()=>{S.step++;drawChar('pop');renderServices();say(SERV[i].say(S.cust));},700);
    if(i===LAST-1){
      later(()=>{beep('win');miniConfetti()},1000);
      later(()=>{S.served=(S.served||[]).concat([S.cust]);$('char').classList.add('out');say(`مع السلامة يا ${S.cust.name} 👋💖`)},2600);
      later(()=>{S.ci++;S.ci>=S.custs.length?finish():enterCustomer()},3400);
    }else later(nextQ,2000);
  }else{
    S.streak=0;beep('no');btn.classList.add('flash-no');later(()=>btn.classList.remove('flash-no'),500);
    S.wrong.push(q);showCorrect(q);drawChar('shake');
    say(['أوه! إجابة غلط، ما فيه خدمة 😬','ركّزي! شعرك ينتظر 🙈','قريبة… جربي السؤال الجاي 💪'][Math.floor(Math.random()*3)]);
    $('fb').className='fb no';$('fb').innerHTML=`❌ اخترتِ ${info(picked)}<br>الإجابة الصحيحة تومض في الجدول ⬇️`;
    later(nextQ,2800);
  }
  upd();
}
function showCorrect(q){
  const target=q.t==='cat'?EL.filter(e=>e.z<=settings.level&&e.c===q.e.c):[q.e];
  target.forEach(e=>S.found.add(e.z));renderCells();
  target.forEach(e=>document.querySelector(`.cell[data-z="${e.z}"]`).classList.add('hint'));
}
function timeout(){
  if(S.lock)return;S.lock=true;S.streak=0;S.attempts++;beep('no');
  S.wrong.push(S.q);showCorrect(S.q);drawChar('shake');say('تأخرتِ! راحت عليكِ الخدمة ⏰');
  $('fb').className='fb no';$('fb').innerHTML=`⏰ انتهى الوقت! ${S.q.t==='cat'?'هذه '+CATS[S.q.e.c].ar:info(S.q.e)}`;
  upd();later(nextQ,2800);
}
function upd(){$('hS').textContent='💰'+AR(S.coins);$('hStreak').textContent=AR(S.streak)+(S.streak>=3?'🔥':'')}

function finish(){
  clearInterval(timer);
  $('game').classList.add('hidden');$('end').classList.remove('hidden');
  const r=S.correct/Math.max(1,S.attempts),st=r>=.85?3:r>=.6?2:r>=.35?1:0;
  $('stars').textContent='⭐'.repeat(st)+'☆'.repeat(3-st);
  $('eScore').textContent=`💰 ${AR(S.coins)} إكرامية`;
  const msg=st===3?`${S.cust.name} نجمة الصالون والكيمياء! ⭐💇‍♀️`:st===2?`شكلك رهيب يا ${S.cust.name}، وإجاباتك أروع 💖`:st===1?'شعرك صار أحلى، والمرة الجاية أسرع!':'لا بأس، التدريب يصنع الإتقان 💪';
  $('eLine').innerHTML=`${msg}<br>إجابات صحيحة ${AR(S.correct)} من ${AR(S.attempts)} محاولة — أطول سلسلة ${AR(S.best)}`;
  let dt='';try{dt=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).format(new Date())}catch(e){}
  const who=S.real?`الجميلة <span class="cn">${S.real.replace(/[<>&]/g,'')}</span>`:'الطالبة الجميلة';
  $('cert').innerHTML=`<div class="cert-in">
    <div class="c-top"><img src="${document.querySelector('.school img').src}" alt="وزارة التعليم"><div class="c-sch">إدارة تعليم المدينة المنورة<br>قطاع الحناكية<br>الابتدائية والمتوسطة الأولى بصخيبرة</div></div>
    <div class="c-title">شهادة شكر وتقدير</div>
    <div class="c-body">
      <div class="c-pic">${charSVG(S.cust,LAST)}</div>
      <p>تتقدّم المعلمة بالشكر والتقدير<br>إلى ${who}<br>لتميّزها في تحدّي <b>صالون الجدول الدوري</b>،<br>متمنيةً لها مزيدًا من التفوق والنجاح 🌸</p>
    </div>
    <div class="c-stars">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}<span>إجابات صحيحة ${AR(S.correct)} من ${AR(S.attempts)}</span></div>
    <div class="c-foot"><div>التاريخ<br><b>${dt}</b></div><div>توقيع المعلمة<br><b class="sig">✍️ ..............</b></div></div>
  </div>`;
  if(S.wrong.length){
    const uniq=[...new Map(S.wrong.map(q=>[q.t==='cat'?'c'+q.e.c:q.e.z,q])).values()];
    $('review').innerHTML='<b>📚 راجعي هذه العناصر:</b><br>'+uniq.map(q=>q.t==='cat'?`• ${CATS[q.e.c].ar}: `+EL.filter(e=>e.z<=settings.level&&e.c===q.e.c).map(e=>e.n).join('، '):'• '+info(q.e)).join('<br>');
    $('review').classList.remove('hidden');
  }else $('review').classList.add('hidden');
  beep('win');confetti(200);
}
function miniConfetti(){confetti(70)}
function confetti(n){
  const c=$('cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#ff6f91','#f2b632','#2bb3a3','#8a4fa0','#8ccaf7','#ffc85c'];
  const ps=[...Array(n)].map(()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,r:4+Math.random()*5,vy:2+Math.random()*3,vx:-1.5+Math.random()*3,a:Math.random()*6,col:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.col;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore()});
    if(++f<200)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height)})();
}

$('goBtn').onclick=start;$('againBtn').onclick=start;
$('menuBtn').onclick=()=>{$('end').classList.add('hidden');$('start').classList.remove('hidden')};
</script>
